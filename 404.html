<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Vincent Bühler</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .fehler { min-height: 78vh; display: grid; place-content: center; text-align: left; }
  .fehler-code {
    font-family: var(--mono); font-size: clamp(64px, 14vw, 148px);
    font-weight: 700; line-height: 1; letter-spacing: -0.05em; color: var(--signal);
  }
  .fehler h1 { font-size: clamp(24px, 4vw, 36px); letter-spacing: -0.025em; margin: 18px 0 12px; }
  .fehler p { color: var(--tinte-weich); max-width: 44ch; margin: 0 0 28px; }
</style>
</head>
<body>
<header class="statusbar">
  <div class="statusbar-inner">
    <span class="sb-id"><b>V. BÜHLER</b><span class="sb-sep">/</span><span class="sb-rolle">APPLIKATIONSENTWICKLUNG EFZ</span></span>
    <span class="sb-status"><i class="dot"></i>Seite nicht gefunden</span>
  </div>
</header>

<main class="sektion">
  <div class="raster fehler">
    <div class="marke">Fehler &nbsp;404</div>
    <div class="fehler-code">404</div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Der Pfad führt ins Leere — vielleicht ein alter Link oder ein Tippfehler.</p>
    <div class="hero-aktionen">
      <a class="knopf primaer" href="/">Zur Startseite</a>
      <a class="knopf" href="/#systeme">Zu den Projekten</a>
    </div>
  </div>
</main>

<footer class="fusszeile">
  <div class="raster fz-inner">
    <span>Vincent Bühler · Othmarsingen AG</span>
    <span>vince.buehler7@gmail.com</span>
  </div>
</footer>
</body>
</html>
